<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចម្រៀងសរសើរតម្កើងព្រះ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 🔥 Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
        }

        .sidebar.collapsed { width: var(--sidebar-collapsed-width); }

        .sidebar-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .toggle-btn:hover { background: #f1f5f9; }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-action-container { padding: 12px 10px 4px 10px; }

        .add-song-sidebar-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .add-song-sidebar-btn:hover { background: var(--primary-hover); }

        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .menu-text,
        .sidebar.collapsed .album-actions,
        .sidebar.collapsed .add-album-btn span,
        .sidebar.collapsed .add-song-sidebar-btn span { display: none; }

        .sidebar-menu { flex: 1; padding: 8px 10px; overflow-y: auto; }

        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .menu-item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .menu-item:hover { background-color: #f1f5f9; color: var(--primary); }
        .menu-item.active { background-color: #3b82f6; color: white; }

        .album-actions { display: none; gap: 4px; }
        .menu-item:hover .album-actions { display: flex; }

        .album-action-btn {
            background: none; border: none; font-size: 0.85rem;
            cursor: pointer; padding: 2px 4px; border-radius: 4px; opacity: 0.8;
        }
        .album-action-btn:hover { opacity: 1; background: rgba(0, 0, 0, 0.1); }

        .album-cover-img {
            width: 32px; height: 32px; border-radius: 6px;
            object-fit: cover; border: 1px solid var(--border); background: #e2e8f0;
        }

        .menu-icon { font-size: 1.2rem; min-width: 32px; text-align: center; }

        .add-album-btn {
            margin: 10px; padding: 10px 14px;
            background: #eff6ff; color: var(--primary);
            border: 1px dashed var(--primary); border-radius: 10px;
            cursor: pointer; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .add-album-btn:hover { background: #dbeafe; }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1; padding: 24px;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded { margin-left: var(--sidebar-collapsed-width); }

        header { margin-bottom: 24px; }
        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
        header p { color: #1e293b; font-size: 1rem; font-weight: 600; line-height: 1.6; text-align: center; }

        .bible-verse { color: #2563eb; font-weight: 700; display: inline-block; margin-top: 2px; }

        .controls { margin-bottom: 24px; }

        .search-box { position: relative; display: flex; align-items: center; width: 100%; }
        .search-box input {
            width: 100%; padding: 12px 45px 12px 18px;
            font-size: 0.95rem; border: 1px solid var(--border);
            border-radius: 10px; outline: none; background: var(--card-bg);
        }

        .search-btn {
            position: absolute; right: 6px; background: none; border: none;
            font-size: 1.1rem; cursor: pointer; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .search-btn:hover { background-color: #f1f5f9; }

        .btn {
            padding: 12px 20px; font-size: 0.95rem; font-weight: 600;
            border: none; border-radius: 10px; cursor: pointer; white-space: nowrap;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: #fee2e2; color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .song-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column;
        }

        .song-img-container { width: 100%; height: 180px; background: #f1f5f9; }
        .song-img { width: 100%; height: 100%; object-fit: cover; }
        .song-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .song-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
        .song-artist { font-size: 0.85rem; color: var(--text-muted); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); grid-column: 1 / -1; }

        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }

        .modal.active { display: flex; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; }

        @media (max-width: 600px) {
            .sidebar { width: var(--sidebar-collapsed-width); }
            .sidebar-title, .menu-text, .album-actions, .add-album-btn span, .add-song-sidebar-btn span { display: none; }
            .main-content { margin-left: var(--sidebar-collapsed-width); padding: 16px; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        <div class="sidebar-title">Album ចម្រៀង</div>
    </div>

    <div class="sidebar-action-container">
        <button class="add-song-sidebar-btn" onclick="openAddSongModal()">
            ➕ <span>បញ្ជូលបទថ្មី</span>
        </button>
    </div>

    <div class="sidebar-menu" id="sidebarMenu"></div>

    <button class="add-album-btn" onclick="openAddAlbumModal()">
        ➕ <span>បន្ថែម Album</span>
    </button>
</div>

<div class="main-content" id="mainContent">
    <header>
        <h1>🎼 ចម្រៀងសរសើរតម្កើងព្រះ</h1>
        <p id="currentAlbumSubtitle">
            ចូរឱ្យជីវិតទាំងឡាយដែលមានដង្ហើម បានសរសើរដល់ព្រះយ៉េហូវ៉ាចុះ<br>
            <span class="bible-verse">ទំនុកដំកើង ១៥០៖៦</span>
        </p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ស្វែងរកចំណងជើង ឬអ្នកចម្រៀង..." onkeyup="renderSongs()">
            <button class="search-btn" onclick="renderSongs()" title="ស្វែងរក">🔍</button>
        </div>
    </div>

    <div class="song-grid" id="songGrid">
        <div class="empty-state">⏳ កំពុងទាញយកទិន្នន័យ...</div>
    </div>
</div>

<!-- Modal 1: Album -->
<div class="modal" id="addAlbumModal">
    <div class="modal-content">
        <h2>📂 បន្ថែម Album ថ្មី</h2>
        <form onsubmit="handleAddAlbum(event)" style="margin-top: 15px;">
            <div class="form-group">
                <label>ឈ្មោះ Album ថ្មី *</label>
                <input type="text" id="newAlbumName" required placeholder="ឧទាហរណ៍៖ ទំនុកដំកើង...">
            </div>
            <div class="form-group">
                <label>ជ្រើសរើសរូបថត Album (Cover Image)</label>
                <input type="file" id="albumCoverFile" accept="image/*" onchange="previewAlbumImage(event)">
            </div>
            <div style="text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn" onclick="closeModal('addAlbumModal')" style="background: #e2e8f0;">បោះបង់</button>
                <button type="submit" class="btn btn-primary">បង្កើត Album</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal 2: Song -->
<div class="modal" id="addSongModal">
    <div class="modal-content">
        <h2>➕ បញ្ចូលបទចម្រៀងថ្មី</h2>
        <form id="addSongForm" onsubmit="handleAddSong(event)" style="margin-top: 15px;">
            <div class="form-group">
                <label>ជ្រើសរើស Album *</label>
                <select id="songAlbumSelect" required></select>
            </div>
            <div class="form-group">
                <label>ចំណងជើងបទចម្រៀង *</label>
                <input type="text" id="songTitle" required placeholder="ឧទាហរណ៍៖ ព្រះគុណព្រះអង្គ">
            </div>
            <div class="form-group">
                <label>ឈ្មោះអ្នកចម្រៀង</label>
                <input type="text" id="songArtist" placeholder="ឈ្មោះអ្នកចម្រៀង">
            </div>
            <div class="form-group">
                <label>ជ្រើសរើសរូបភាព *</label>
                <input type="file" id="songImageFile" accept="image/*" onchange="previewFileImage(event)" required>
            </div>
            <div style="text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn" onclick="closeModal('addSongModal')" style="background: #e2e8f0;">បោះបង់</button>
                <button type="submit" id="saveBtn" class="btn btn-primary">រក្សាទុក</button>
            </div>
        </form>
    </div>
</div>

<script>
  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBtnbu6tEFtHQLaYsoYVaim33h4TkjwYUI",
  authDomain: "my-song-app-93c70.firebaseapp.com",
  projectId: "my-song-app-93c70",
  storageBucket: "my-song-app-93c70.firebasestorage.app",
  messagingSenderId: "953879214507",
  appId: "1:953879214507:web:90e84db6373dfdb3c47aee",
  measurementId: "G-ZXC8HSTY69"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SECURITY_PIN = "1234";
    let songsList = [];
    let customAlbums = [
        { name: 'ទំនុកដំកើង', image: '' },
        { name: 'ទំនុកខ្មែរបរិសុទ្ធ', image: '' }
    ];
    let currentSelectedAlbum = 'ALL';
    let selectedImageBase64 = '';
    let selectedAlbumImageBase64 = '';

    window.onload = function() {
        listenToSongs();
    };

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    }

    // ⚡ មុខងារពង្រួមរូបភាពឱ្យស្រាលស្វ័យប្រវត្តិ (Compress & Resize) ធ្វើឱ្យលឿនខ្លាំង!
    function compressImage(file, maxWidth, quality, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                callback(compressedBase64);
            };
        };
    }

    function listenToSongs() {
        db.collection("songs").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            songsList = [];
            snapshot.forEach((doc) => {
                songsList.push({ id: doc.id, ...doc.data() });
            });

            songsList.forEach(s => {
                if (s.album && !customAlbums.some(a => a.name === s.album) && s.album !== 'ទូទៅ') {
                    customAlbums.push({ name: s.album, image: '' });
                }
            });

            renderSidebarMenu();
            renderSongs();
        }, (error) => {
            console.error("Firebase Error: ", error);
            document.getElementById('songGrid').innerHTML = `<div class="empty-state">❌ មិនទាន់មានបទចម្រៀងឡើយ</div>`;
        });
    }

    function renderSidebarMenu() {
        const menuContainer = document.getElementById('sidebarMenu');
        let html = `
            <div class="menu-item ${currentSelectedAlbum === 'ALL' ? 'active' : ''}" onclick="selectAlbum('ALL')">
                <div class="menu-item-left">
                    <div class="menu-icon">📄</div>
                    <div class="menu-text">បទទាំងអស់</div>
                </div>
            </div>
        `;

        customAlbums.forEach(album => {
            const imgHtml = album.image 
                ? `<img src="${album.image}" class="album-cover-img" alt="${album.name}">` 
                : `<div class="menu-icon">📖</div>`;

            html += `
                <div class="menu-item ${currentSelectedAlbum === album.name ? 'active' : ''}" onclick="selectAlbum('${album.name}')">
                    <div class="menu-item-left">
                        ${imgHtml}
                        <div class="menu-text" title="${album.name}">${album.name}</div>
                    </div>
                    <div class="album-actions">
                        <button class="album-action-btn" onclick="editAlbum(event, '${album.name}')" title="កែឈ្មោះ">✏️</button>
                        <button class="album-action-btn" onclick="deleteAlbum(event, '${album.name}')" title="លុប Album">🗑️</button>
                    </div>
                </div>
            `;
        });

        menuContainer.innerHTML = html;
    }

    function selectAlbum(albumName) {
        currentSelectedAlbum = albumName;
        renderSidebarMenu();
        
        const subtitle = document.getElementById('currentAlbumSubtitle');
        if (albumName === 'ALL') {
            subtitle.innerHTML = 'ចូរឱ្យជីវិតទាំងឡាយដែលមានដង្ហើម បានសរសើរដល់ព្រះយ៉េហូវ៉ាចុះ<br><span class="bible-verse">ទំនុកដំកើង ១៥០៖៦</span>';
        } else {
            subtitle.innerText = "Album ៖ " + albumName;
        }

        renderSongs();
    }

    function deleteAlbum(event, albumName) {
        event.stopPropagation();
        const inputPin = prompt(`🔒 សូមបញ្ចូលលេខកូដសម្ងាត់ (PIN) ដើម្បីធ្វើការលុប Album «${albumName}»៖`);
        if (inputPin === null) return;

        if (inputPin.trim() !== SECURITY_PIN) {
            alert("❌ លេខកូដសម្ងាត់មិនត្រឹមត្រូវទេ!");
            return;
        }

        const songsInAlbum = songsList.filter(s => (s.album || 'ទូទៅ') === albumName);
        if (songsInAlbum.length > 0) {
            alert(`🛑 មិនអនុញ្ញាតឱ្យលុប Album «${albumName}» នេះឡើយ!\n\nមូលហេតុ៖ Album នេះមានបទចម្រៀងចំនួន ${songsInAlbum.length} បទនៅខាងក្នុង។`);
            return;
        }

        const confirmName = prompt(`⚠️ បញ្ជាក់ការលុប Album «${albumName}»\n\nសូមវាយឈ្មោះ Album៖ «${albumName}» ឡើងវិញដើម្បីលុប៖`);
        if (confirmName && confirmName.trim() === albumName) {
            customAlbums = customAlbums.filter(a => a.name !== albumName);
            alert(`✅ បានលុប Album «${albumName}» ដោយជោគជ័យ!`);
            if (currentSelectedAlbum === albumName) selectAlbum('ALL');
            else renderSidebarMenu();
        }
    }

    function editAlbum(event, oldName) {
        event.stopPropagation();
        const newName = prompt("សូមបញ្ចូលឈ្មោះ Album ថ្មី៖", oldName);
        if (newName && newName.trim() !== "" && newName !== oldName) {
            const trimmedName = newName.trim();
            if (customAlbums.some(a => a.name.toLowerCase() === trimmedName.toLowerCase())) {
                alert("ឈ្មោះ Album នេះមានរួចហើយ!");
                return;
            }

            const albumObj = customAlbums.find(a => a.name === oldName);
            if (albumObj) albumObj.name = trimmedName;

            if (currentSelectedAlbum === oldName) selectAlbum(trimmedName);
            else renderSidebarMenu();
        }
    }

    function renderSongs() {
        const grid = document.getElementById('songGrid');
        const query = document.getElementById('searchInput').value.toLowerCase().trim();

        const filtered = songsList.filter(s => {
            const matchesSearch = (s.title && s.title.toLowerCase().includes(query)) || 
                                  (s.artist && s.artist.toLowerCase().includes(query));
            const matchesAlbum = currentSelectedAlbum === 'ALL' || (s.album || 'ទូទៅ') === currentSelectedAlbum;
            return matchesSearch && matchesAlbum;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">❌ មិនទាន់មានបទចម្រៀងឡើយ</div>`;
            return;
        }

        grid.innerHTML = filtered.map(song => `
            <div class="song-card">
                <div class="song-img-container">
                    <img src="${song.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image'}" class="song-img" alt="${song.title}">
                </div>
                <div class="song-info">
                    <div>
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist || 'មិនស្គាល់អ្នកចម្រៀង'}</div>
                    </div>
                    <div style="text-align: right; margin-top: 10px;">
                        <button class="btn-danger" onclick="deleteSong('${song.id}')">🗑️ លុប</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openAddAlbumModal() { document.getElementById('addAlbumModal').classList.add('active'); }
    
    function openAddSongModal() { 
        const select = document.getElementById('songAlbumSelect');
        select.innerHTML = customAlbums.map(a => `<option value="${a.name}" ${a.name === currentSelectedAlbum ? 'selected' : ''}>${a.name}</option>`).join('');
        document.getElementById('addSongModal').classList.add('active'); 
    }

    function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }

    function previewAlbumImage(event) {
        const file = event.target.files[0];
        if (file) {
            compressImage(file, 200, 0.6, function(base64) {
                selectedAlbumImageBase64 = base64;
            });
        }
    }

    function handleAddAlbum(e) {
        e.preventDefault();
        const albumName = document.getElementById('newAlbumName').value.trim();
        if (customAlbums.some(a => a.name.toLowerCase() === albumName.toLowerCase())) {
            alert('Album ឈ្មោះនេះមានរួចហើយ!');
            return;
        }

        if (albumName) {
            customAlbums.push({ name: albumName, image: selectedAlbumImageBase64 });
            selectAlbum(albumName);
            document.getElementById('newAlbumName').value = '';
            document.getElementById('albumCoverFile').value = '';
            selectedAlbumImageBase64 = '';
            closeModal('addAlbumModal');
        }
    }

    function previewFileImage(event) {
        const file = event.target.files[0];
        if (file) {
            // ពង្រួមរូបភាពបទចម្រៀងឱ្យនៅ 500px & Quality 70%
            compressImage(file, 500, 0.7, function(base64) {
                selectedImageBase64 = base64;
            });
        }
    }

    async function handleAddSong(e) {
        e.preventDefault();
        const title = document.getElementById('songTitle').value.trim();
        const artist = document.getElementById('songArtist').value.trim();
        const album = document.getElementById('songAlbumSelect').value;

        const isDuplicate = songsList.some(song => 
            song.title.toLowerCase().trim() === title.toLowerCase() && 
            (song.album || 'ទូទៅ') === album
        );

        if (isDuplicate) {
            alert(`⚠️ បទចម្រៀង «${title}» មានក្នុង Album «${album}» រួចហើយ!`);
            return;
        }

        if (!selectedImageBase64) {
            alert('សូមរង់ចាំមួយភ្លែត ឱ្យរូបភាពដំណើរការរៀបចំរួចរាល់សិន!');
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = '⏳ កំពុងរក្សាទុក...';
        saveBtn.disabled = true;

        try {
            await db.collection("songs").add({
                title: title,
                artist: artist,
                album: album,
                imageUrl: selectedImageBase64,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal('addSongModal');
            document.getElementById('addSongForm').reset();
            selectedImageBase64 = '';
            alert('✅ បានបញ្ចូលបទចម្រៀងដោយជោគជ័យ!');
        } catch (error) {
            alert('❌ មានបញ្ហាក្នុងការរក្សាទុក៖ ' + error.message);
        } finally {
            saveBtn.innerText = 'រក្សាទុក';
            saveBtn.disabled = false;
        }
    }

    async function deleteSong(id) {
        if (confirm('តើអ្នកពិតជាចង់លុបបទចម្រៀងនេះមែនទេ?')) {
            try {
                await db.collection("songs").doc(id).delete();
            } catch (error) {
                alert('❌ មិនអាចលុបបានទេ៖ ' + error.message);
            }
        }
    }
</script>

</body>
