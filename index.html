<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចម្រៀងសរសើរតម្កើងព្រះ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 200px;
        }

        .search-box input, .filter-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--card-bg);
        }

        .filter-box {
            flex: 1;
            min-width: 150px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .song-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .song-img-container {
            width: 100%;
            height: 220px;
            background: #f1f5f9;
        }

        .song-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .song-album-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 12px;
            width: fit-content;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎼 ចម្រៀងសរសើរតម្កើងព្រះ</h1>
        <p>ចូរឲ្យជីវិតដែលមានដង្ហើមបានសរសើរព្រះ</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" oninput="renderSongs()" placeholder="ស្វែងរកចំណងជើង ឬអ្នកចម្រៀង...">
        </div>
        <div class="filter-box">
            <select id="albumFilter" class="filter-select" onchange="renderSongs()">
                <option value="ALL">📂 Album ទាំងអស់</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">➕ បញ្ចូលបទថ្មី</button>
    </div>

    <div class="song-grid" id="songGrid">
        <div class="empty-state">⏳ កំពុងទាញយកទិន្នន័យ...</div>
    </div>
</div>

<!-- Modal បញ្ចូលបទថ្មី -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>➕ បញ្ចូលបទចម្រៀងថ្មី</h2>
        <form id="addSongForm" onsubmit="handleAddSong(event)" style="margin-top: 15px;">
            <div class="form-group">
                <label>ចំណងជើងបទចម្រៀង *</label>
                <input type="text" id="songTitle" required>
            </div>
            <div class="form-group">
                <label>ឈ្មោះអ្នកចម្រៀង</label>
                <input type="text" id="songArtist">
            </div>
            <div class="form-group">
                <label>ឈ្មោះ Album (ឧទាហរណ៍៖ Album 1, ថ្វាយបង្គំ...)</label>
                <input type="text" id="songAlbum" placeholder="ទូទៅ">
            </div>
            <div class="form-group">
                <label>ជ្រើសរើសរូបភាព *</label>
                <input type="file" id="songImageFile" accept="image/*" onchange="previewFileImage(event)" required>
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button type="button" class="btn" onclick="closeAddModal()">បោះបង់</button>
                <button type="submit" id="saveBtn" class="btn btn-primary">រក្សាទុក</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --------------------------------------------------------------------------
    // ⚠️ ដាក់ LINK WEB APP URL របស់អ្នកត្រង់នេះ៖
    // --------------------------------------------------------------------------
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxzvUXngoX13hYiXvwU-UQxYlxhzGz5zf9eds5I29FKhO1W_n5HHKbETLYzBUk844Fnlw/exec";

    let songsList = [];
    let selectedImageBase64 = '';

    window.onload = function() {
        fetchSongs();
    };

    async function fetchSongs() {
        const grid = document.getElementById('songGrid');
        grid.innerHTML = `<div class="empty-state">⏳ កំពុងទាញយកទិន្នន័យ...</div>`;
        try {
            const response = await fetch(GOOGLE_SHEET_URL);
            songsList = await response.json();
            songsList.reverse();
            populateAlbumFilter();
            renderSongs();
        } catch (error) {
            grid.innerHTML = `<div class="empty-state">❌ មានបញ្ហាក្នុងការទាញយកទិន្នន័យ!</div>`;
        }
    }

    function populateAlbumFilter() {
        const filterSelect = document.getElementById('albumFilter');
        const albums = [...new Set(songsList.map(s => s.album || 'ទូទៅ'))];
        
        filterSelect.innerHTML = `<option value="ALL">📂 Album ទាំងអស់</option>` + 
            albums.map(a => `<option value="${a}">💿 ${a}</option>`).join('');
    }

    function renderSongs() {
        const grid = document.getElementById('songGrid');
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedAlbum = document.getElementById('albumFilter').value;

        const filtered = songsList.filter(s => {
            const matchesSearch = (s.title && s.title.toLowerCase().includes(query)) || 
                                  (s.artist && s.artist.toLowerCase().includes(query));
            const matchesAlbum = selectedAlbum === 'ALL' || (s.album || 'ទូទៅ') === selectedAlbum;
            return matchesSearch && matchesAlbum;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">❌ មិនមានបទចម្រៀងឡើយ</div>`;
            return;
        }

        grid.innerHTML = filtered.map(song => `
            <div class="song-card">
                <div class="song-img-container">
                    <img src="${song.image}" class="song-img" alt="${song.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                </div>
                <div class="song-info">
                    <div>
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist || 'មិនស្គាល់អ្នកចម្រៀង'}</div>
                        <div class="song-album-tag">💿 ${song.album || 'ទូទៅ'}</div>
                    </div>
                    <div style="text-align: right; margin-top: 10px;">
                        <button class="btn btn-danger" onclick="deleteSong('${song.id}')">🗑️ លុប</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openAddModal() { document.getElementById('addModal').classList.add('active'); }
    function closeAddModal() { 
        document.getElementById('addModal').classList.remove('active'); 
        document.getElementById('addSongForm').reset();
        selectedImageBase64 = '';
    }

    function previewFileImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    async function handleAddSong(e) {
        e.preventDefault();
        const title = document.getElementById('songTitle').value.trim();
        const artist = document.getElementById('songArtist').value.trim();
        const album = document.getElementById('songAlbum').value.trim() || 'ទូទៅ';

        if (!selectedImageBase64) {
            alert('សូមជ្រើសរើសរូបភាព!');
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = '⏳ កំពុងរក្សាទុក...';
        saveBtn.disabled = true;

        try {
            await fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'add',
                    title: title,
                    artist: artist,
                    album: album,
                    image: selectedImageBase64
                })
            });
            closeAddModal();
            fetchSongs();
        } catch (error) {
            alert('មានបញ្ហាក្នុងការរក្សាទុក៖ ' + error);
        } finally {
            saveBtn.innerText = 'រក្សាទុក';
            saveBtn.disabled = false;
        }
    }

    async function deleteSong(id) {
        if (confirm('តើអ្នកពិតជាចង់លុបបទចម្រៀងនេះមែនទេ?')) {
            await fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'delete',
                    id: id
                })
            });
            fetchSongs();
        }
    }
</script>

</body>
</html>
