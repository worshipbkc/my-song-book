<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចម្រៀងសរសើរតម្កើងព្រះ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 🔥 Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; position: relative; }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 99; }
        .sidebar-overlay.active { display: block; }

        .sidebar {
            width: var(--sidebar-width); background: var(--card-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .sidebar-title { font-size: 1.1rem; font-weight: 700; }
        .close-sidebar-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; display: none; padding: 4px 8px; border-radius: 6px; }

        /* 👤 Profile Area & Dropdown Menu */
        .user-profile-wrapper { 
            border-bottom: 1px solid var(--border); 
            background: #f8fafc; 
            position: relative; 
            width: 100%;
        }
        
        .user-profile-card {
            padding: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            cursor: pointer; 
            user-select: none; 
            transition: background 0.2s;
            width: 100%;
        }
        .user-profile-card:hover { background: #f1f5f9; }

        .user-info { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
        .user-details { font-size: 0.85rem; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
        .user-name { font-weight: 700; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; color: var(--text); }
        .user-role { font-size: 0.75rem; color: #16a34a; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        
        .dropdown-arrow { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            transition: transform 0.3s ease; 
            padding-left: 8px;
        }
        .user-profile-card.active .dropdown-arrow { transform: rotate(180deg); }

        /* Dropdown Slide Container */
        .profile-dropdown-menu {
            display: none;
            background: #ffffff; 
            border-top: 1px solid var(--border); 
            padding: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .profile-dropdown-menu.open { 
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-item {
            display: flex; 
            align-items: center; 
            gap: 10px; 
            width: 100%; 
            padding: 10px 12px;
            border: none; 
            background: transparent; 
            border-radius: 8px; 
            font-size: 0.88rem;
            font-weight: 600; 
            cursor: pointer; 
            text-align: left; 
            color: var(--text); 
            transition: background 0.2s;
        }
        .dropdown-item:hover { background: #f1f5f9; }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item.danger:hover { background: #fee2e2; }

        .btn-auth {
            padding: 10px 14px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%;
        }
        .btn-google { background: white; border: 1px solid var(--border); color: #333; margin: 12px 14px; width: calc(100% - 28px); }

        .sidebar-action-container { padding: 12px 14px 4px 14px; }
        .add-song-sidebar-btn {
            width: 100%; padding: 12px 14px; background: var(--primary); color: white; border: none;
            border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .sidebar-menu { flex: 1; padding: 10px 14px; overflow-y: auto; }
        .menu-item {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            border-radius: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 0.95rem;
            margin-bottom: 6px; transition: all 0.2s;
        }
        .menu-item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .menu-item:hover { background-color: #f1f5f9; color: var(--primary); }
        .menu-item.active { background-color: #3b82f6; color: white; }

        .add-album-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px; background: transparent; border: 1px dashed var(--border);
            border-radius: 8px; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; margin-top: 10px; font-weight: 600;
        }
        .add-album-btn:hover { background: #f1f5f9; color: var(--primary); }

        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 24px; width: 100%; }
        .mobile-header { display: none; align-items: center; gap: 12px; margin-bottom: 16px; }
        .mobile-menu-btn { background: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; }

        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
        header p { color: #1e293b; font-size: 1rem; font-weight: 600; line-height: 1.6; text-align: center; }

        .controls { margin-bottom: 24px; margin-top: 15px; }
        .search-box { position: relative; display: flex; align-items: center; width: 100%; }
        .search-box input { width: 100%; padding: 12px 45px 12px 18px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 10px; outline: none; background: var(--card-bg); }
        .search-btn { position: absolute; right: 6px; background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 8px; border-radius: 8px; }

        .btn { padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-warning { background-color: #fef3c7; color: #b45309; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-danger { background-color: #fee2e2; color: var(--danger); border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-save { background-color: #f1f5f9; color: #0f172a; border: 1px solid var(--border); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

        .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .song-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .song-img-container { width: 100%; min-height: 220px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
        .song-img { width: 100%; height: 100%; max-height: 380px; object-fit: contain; display: block; }
        .song-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .song-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
        .song-artist { font-size: 0.85rem; color: var(--text-muted); }
        .song-editor-info { font-size: 0.72rem; color: #94a3b8; margin-top: 6px; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); grid-column: 1 / -1; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; }

        /* Full Screen Viewer */
        .fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.94); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-header { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .fullscreen-img-container { width: 100%; height: 82vh; display: flex; align-items: center; justify-content: center; }
        .fullscreen-img { max-width: 98%; max-height: 98%; object-fit: contain; }

        .editor-only { display: none !important; }
        .editor-authorized .editor-only { display: flex !important; }
        .editor-authorized button.editor-only { display: inline-block !important; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 80%; max-width: 300px; }
            .sidebar.mobile-open { transform: translateX(0); }
            .close-sidebar-btn { display: block; }
            .main-content { margin-left: 0; padding: 16px; }
            .mobile-header { display: flex; }
        }
    </style>
</head>
<body id="bodyContainer">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Album ចម្រៀង</div>
        <button class="close-sidebar-btn" onclick="closeMobileSidebar()">✖</button>
    </div>

    <!-- 👤 ផ្ទាំង Profile Admin / Login ជាមួយ Dropdown Menu ដែលបានលាក់ប៊ូតុងចាស់ៗចេញ -->
    <div class="user-profile-wrapper" id="userProfileArea">
        <button class="btn-auth btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
            <span>Login តាម Gmail</span>
        </button>
    </div>

    <!-- ➕ ប៊ូតុងបន្ថែមបទថ្មី (សម្រាប់ Editor/Admin) -->
    <div class="sidebar-action-container editor-only">
        <button class="add-song-sidebar-btn" onclick="openAddSongModal(); closeMobileSidebar();">
            ➕ <span>បញ្ជូលបទថ្មី</span>
        </button>
    </div>

    <!-- 📖 បញ្ជី Album -->
    <div class="sidebar-menu">
        <div id="sidebarMenu"></div>
        
        <!-- ➕ ប៊ូតុងបង្កើត Album ថ្មី (សម្រាប់តែ Editor/Admin) -->
        <button class="add-album-btn editor-only" onclick="addNewAlbum()">
            ➕ <span>បង្កើត Album ថ្មី</span>
        </button>
    </div>
</div>

<div class="main-content">
    <div class="mobile-header">
        <button class="mobile-menu-btn" onclick="openMobileSidebar()">☰ <span>Album</span></button>
    </div>

    <header>
        <h1>🎼 ចម្រៀងសរសើរតម្កើងព្រះ</h1>
        <p id="currentAlbumSubtitle">
            ចូរឱ្យជីវិតទាំងឡាយដែលមានដង្ហើម បានសរសើរដល់ព្រះយ៉េហូវ៉ាចុះ<br>
            <span style="color: #2563eb; font-weight: 700;">ទំនុកដំកើង ១៥០៖៦</span>
        </p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ស្វែងរកចំណងជើង ឬអ្នកចម្រៀង..." onkeyup="renderSongs()">
            <button class="search-btn" onclick="renderSongs()">🔍</button>
        </div>
    </div>

    <div class="song-grid" id="songGrid">
        <div class="empty-state">⏳ កំពុងទាញយកទិន្នន័យ...</div>
    </div>
</div>

<!-- 🔍 Lightbox Viewer -->
<div class="fullscreen-modal" id="fullScreenModal" onclick="closeFullScreenModal(event)">
    <div class="fullscreen-header">
        <div id="fullScreenTitle" style="font-weight: 700;"></div>
        <button onclick="closeFullScreenModalDirect()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">✖</button>
    </div>
    <div class="fullscreen-img-container">
        <img src="" id="fullScreenImg" class="fullscreen-img" alt="Song">
    </div>
</div>

<!-- Modal 1: បន្ថែមបទថ្មី -->
<div class="modal" id="addSongModal">
    <div class="modal-content">
        <h2>➕ បញ្ចូលបទចម្រៀងថ្មី</h2>
        <form id="addSongForm" onsubmit="handleAddSong(event)" style="margin-top: 15px;">
            <div class="form-group">
                <label>ជ្រើសរើស Album *</label>
                <select id="songAlbumSelect" required></select>
            </div>
            <div class="form-group">
                <label>ចំណងជើងបទចម្រៀង *</label>
                <input type="text" id="songTitle" required placeholder="ឧទាហរណ៍៖ ព្រះគុណព្រះអង្គ">
            </div>
            <div class="form-group">
                <label>ឈ្មោះអ្នកចម្រៀង</label>
                <input type="text" id="songArtist" placeholder="ឈ្មោះអ្នកចម្រៀង">
            </div>
            <div class="form-group">
                <label>ជ្រើសរើសរូបភាព *</label>
                <input type="file" id="songImageFile" accept="image/*" onchange="previewFileImage(event)" required>
            </div>
            <div style="text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn" onclick="closeModal('addSongModal')" style="background: #e2e8f0;">បោះបង់</button>
                <button type="submit" id="saveBtn" class="btn btn-primary">រក្សាទុក</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal 2: កែប្រែបទចម្រៀង -->
<div class="modal" id="editSongModal">
    <div class="modal-content">
        <h2>✏️ កែប្រែបទចម្រៀង / ដូររូបភាព</h2>
        <form id="editSongForm" onsubmit="handleUpdateSong(event)" style="margin-top: 15px;">
            <input type="hidden" id="editSongId">
            <div class="form-group">
                <label>ជ្រើសរើស Album *</label>
                <select id="editSongAlbumSelect" required></select>
            </div>
            <div class="form-group">
                <label>ចំណងជើងបទចម្រៀង *</label>
                <input type="text" id="editSongTitle" required>
            </div>
            <div class="form-group">
                <label>ឈ្មោះអ្នកចម្រៀង</label>
                <input type="text" id="editSongArtist">
            </div>
            <div class="form-group">
                <label>ប្ដូររូបភាពថ្មី (បើមិនប្ដូរទេ រក្សារូបចាស់)</label>
                <input type="file" id="editSongImageFile" accept="image/*" onchange="previewEditFileImage(event)">
            </div>
            <div style="text-align: right; margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn" onclick="closeModal('editSongModal')" style="background: #e2e8f0;">បោះបង់</button>
                <button type="submit" id="updateBtn" class="btn btn-primary">រក្សាទុកការកែប្រែ</button>
            </div>
        </form>
    </div>
</div>

<script>
    // 🔥 Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBtnbu6tEFtHQLaYsoYVaim33h4TkjwYUI",
        authDomain: "my-song-app-93c70.firebaseapp.com",
        projectId: "my-song-app-93c70",
        storageBucket: "my-song-app-93c70.firebasestorage.app",
        messagingSenderId: "953879214507",
        appId: "1:953879214507:web:90e84db6373dfdb3c47aee",
        measurementId: "G-ZXC8HSTY69"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let isEditor = false;
    let isAdmin = false;
    let songsList = [];
    let customAlbums = ['ទំនុកដំកើង', 'ទំនុកខ្មែរបរិសុទ្ធ'];
    let currentSelectedAlbum = 'ALL';
    let selectedImageBase64 = '';
    let selectedEditImageBase64 = '';

    window.onload = function() {
        listenToAuth();
        listenToAlbums();
        listenToSongs();
    };

    /* 🔐 តាមដានការ Login/Logout */
    function listenToAuth() {
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                const doc = await db.collection("editors").doc(user.email.toLowerCase()).get();
                if (doc.exists) {
                    isEditor = true;
                    isAdmin = doc.data().role === 'admin';
                    document.getElementById('bodyContainer').classList.add('editor-authorized');
                } else {
                    isEditor = false;
                    isAdmin = false;
                    document.getElementById('bodyContainer').classList.remove('editor-authorized');
                }
                renderUserProfile(user);
            } else {
                isEditor = false;
                isAdmin = false;
                document.getElementById('bodyContainer').classList.remove('editor-authorized');
                document.getElementById('userProfileArea').innerHTML = `
                    <button class="btn-auth btn-google" onclick="loginWithGoogle()">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                        <span>Login តាម Gmail</span>
                    </button>`;
            }
            renderSongs();
        });
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => alert("❌ Login ខកខាន៖ " + error.message));
    }

    function logout() { auth.signOut(); }

    /* 👤 បង្ហាញ Profile Card និងទម្លាក់ Dropdown មកក្រោម */
    function renderUserProfile(user) {
        document.getElementById('userProfileArea').innerHTML = `
            <div class="user-profile-card" id="profileToggleBtn" onclick="toggleProfileDropdown()">
                <div class="user-info">
                    <img src="${user.photoURL || 'https://via.placeholder.com/42'}" class="user-avatar">
                    <div class="user-details">
                        <div class="user-name">${user.displayName || 'អ្នកប្រើប្រាស់'}</div>
                        <div class="user-role">${isAdmin ? '👑 Admin' : (isEditor ? '✏️ Editor' : '👁️ មើលប៉ុណ្ណោះ')}</div>
                    </div>
                </div>
                <div class="dropdown-arrow">▼</div>
            </div>

            <div class="profile-dropdown-menu" id="profileDropdownMenu">
                ${isAdmin ? `<button class="dropdown-item" onclick="handleInvite()"><span style="font-size:1.1rem;">✉️</span> <span>Invite</span></button>` : ''}
                ${(!isAdmin && !isEditor) ? `<button class="dropdown-item" onclick="handleJoin()"><span style="font-size:1.1rem;">✉️</span> <span>សុំសិទ្ធិកែប្រែ</span></button>` : ''}
                <button class="dropdown-item danger" onclick="logout()"><span style="font-size:1.1rem;">🚪</span> <span>Log Out</span></button>
            </div>
        `;
    }

    /* 🔽 បើក/បិទ Dropdown Menu */
    function toggleProfileDropdown() {
        const menu = document.getElementById('profileDropdownMenu');
        const btn = document.getElementById('profileToggleBtn');
        menu.classList.toggle('open');
        btn.classList.toggle('active');
    }

    /* ✉️ Admin Invite អ៊ីមែលថ្មី */
    async function handleInvite() {
        const emailToInvite = prompt("✉️ [Admin] បញ្ចូល Gmail របស់អ្នកដែលអ្នកចង់ Invite ឱ្យមានសិទ្ធិកែប្រែ៖");
        if (emailToInvite && emailToInvite.includes('@')) {
            const cleanEmail = emailToInvite.trim().toLowerCase();
            await db.collection("editors").doc(cleanEmail).set({
                email: cleanEmail,
                role: 'editor',
                addedBy: currentUser.email,
                addedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert(`✅ បានបន្ថែមសិទ្ធិឱ្យ ${cleanEmail} រួចរាល់!`);
        }
    }

    /* ✉️ User ធម្មតាសុំ Join */
    async function handleJoin() {
        if (confirm(`តើអ្នកចង់ផ្ញើសំណើ Join ដើម្បីសុំសិទ្ធិកែប្រែទិន្នន័យដោយប្រើអ៊ីមែល ${currentUser.email} ដែរឬទេ?`)) {
            await db.collection("join_requests").doc(currentUser.email.toLowerCase()).set({
                email: currentUser.email,
                name: currentUser.displayName,
                requestedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("✅ សំណើរបស់អ្នកត្រូវបានផ្ញើជូន Admin រួចរាល់!");
        }
    }

    /* 📖 គ្រប់គ្រង Album */
    function listenToAlbums() {
        db.collection("albums").onSnapshot((snapshot) => {
            let albums = [];
            snapshot.forEach(doc => albums.push(doc.data().name));
            if (albums.length > 0) customAlbums = albums;
            renderSidebarMenu();
        });
    }

    async function addNewAlbum() {
        const albumName = prompt("➕ បញ្ចូលឈ្មោះ Album ថ្មី៖");
        if (albumName && albumName.trim() !== "") {
            const name = albumName.trim();
            await db.collection("albums").doc(name).set({ name });
            alert(`✅ បានបង្កើត Album «${name}» រួចរាល់!`);
        }
    }

    /* 🎶 ស្វែងរក និងបង្ហាញបទចម្រៀង */
    function listenToSongs() {
        db.collection("songs").onSnapshot((snapshot) => {
            songsList = [];
            snapshot.forEach((doc) => songsList.push({ id: doc.id, ...doc.data() }));
            renderSongs();
        });
    }

    function renderSongs() {
        const grid = document.getElementById('songGrid');
        const query = document.getElementById('searchInput').value.toLowerCase().trim();

        const filtered = songsList.filter(s => {
            const matchesSearch = (s.title && s.title.toLowerCase().includes(query)) || (s.artist && s.artist.toLowerCase().includes(query));
            const matchesAlbum = currentSelectedAlbum === 'ALL' || (s.album || 'ទូទៅ') === currentSelectedAlbum;
            return matchesSearch && matchesAlbum;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">❌ មិនទាន់មានបទចម្រៀងឡើយ</div>`;
            return;
        }

        grid.innerHTML = filtered.map(song => {
            const safeTitle = (song.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const editorInfo = song.updatedBy ? `កែចុងក្រោយ៖ ${song.updatedBy}` : (song.createdBy ? `បញ្ចូលដោយ៖ ${song.createdBy}` : '');

            return `
            <div class="song-card">
                <div class="song-img-container" onclick="openFullScreen('${song.imageUrl}', '${safeTitle}')">
                    <img src="${song.imageUrl || 'https://via.placeholder.com/300x200'}" class="song-img" loading="lazy">
                </div>
                <div class="song-info">
                    <div>
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist || 'មិនស្គាល់អ្នកចម្រៀង'}</div>
                        ${editorInfo ? `<div class="song-editor-info">👤 ${editorInfo}</div>` : ''}
                    </div>
                    <div style="display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px;">
                        <a href="${song.imageUrl}" download="${song.title}.jpg" class="btn-save">💾 Save</a>
                        ${isEditor ? `
                            <button class="btn-warning" onclick="openEditSongModal('${song.id}')">✏️ កែប្រែ</button>
                            <button class="btn-danger" onclick="deleteSong('${song.id}', '${safeTitle}')">🗑️ លុប</button>
                        ` : ''}
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    /* ➕ បញ្ចូលបទថ្មី */
    async function handleAddSong(e) {
        e.preventDefault();
        if (!isEditor) return alert("❌ អ្នកគ្មានសិទ្ធិបញ្ចូលបទចម្រៀងទេ!");

        const title = document.getElementById('songTitle').value.trim();
        const artist = document.getElementById('songArtist').value.trim();
        const album = document.getElementById('songAlbumSelect').value;

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = '⏳ កំពុងរក្សាទុក...'; saveBtn.disabled = true;

        try {
            await db.collection("songs").add({
                title, artist, album,
                imageUrl: selectedImageBase64,
                createdBy: currentUser.displayName || currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal('addSongModal');
            document.getElementById('addSongForm').reset();
            alert('✅ បានបញ្ចូលបទចម្រៀងដោយជោគជ័យ!');
        } catch (error) {
            alert('❌ មានបញ្ហា៖ ' + error.message);
        } finally {
            saveBtn.innerText = 'រក្សាទុក'; saveBtn.disabled = false;
        }
    }

    /* ✏️ កែប្រែបទចម្រៀង */
    function openEditSongModal(songId) {
        if (!isEditor) return alert("❌ អ្នកគ្មានសិទ្ធិកែប្រែទេ!");
        const song = songsList.find(s => s.id === songId);
        if (!song) return;

        document.getElementById('editSongId').value = song.id;
        document.getElementById('editSongTitle').value = song.title || '';
        document.getElementById('editSongArtist').value = song.artist || '';

        const select = document.getElementById('editSongAlbumSelect');
        select.innerHTML = customAlbums.map(a => `<option value="${a}" ${a === song.album ? 'selected' : ''}>${a}</option>`).join('');

        selectedEditImageBase64 = '';
        document.getElementById('editSongModal').classList.add('active');
    }

    async function handleUpdateSong(e) {
        e.preventDefault();
        const id = document.getElementById('editSongId').value;
        const updateData = {
            title: document.getElementById('editSongTitle').value.trim(),
            artist: document.getElementById('editSongArtist').value.trim(),
            album: document.getElementById('editSongAlbumSelect').value,
            updatedBy: currentUser.displayName || currentUser.email,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (selectedEditImageBase64) updateData.imageUrl = selectedEditImageBase64;

        await db.collection("songs").doc(id).update(updateData);
        closeModal('editSongModal');
        alert('✅ បានកែប្រែដោយជោគជ័យ!');
    }

    async function deleteSong(id, title) {
        if (!isEditor) return alert("❌ អ្នកគ្មានសិទ្ធិលុបទេ!");
        if (confirm(`⚠️ តើអ្នកប្រាកដថាលុបបទ «${title}» នេះមែនទេ?`)) {
            await db.collection("songs").doc(id).delete();
            alert(`✅ បានលុបបទ «${title}» រួចរាល់!`);
        }
    }

    // Helper Functions
    function openMobileSidebar() { document.getElementById('sidebar').classList.add('mobile-open'); document.getElementById('sidebarOverlay').classList.add('active'); }
    function closeMobileSidebar() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebarOverlay').classList.remove('active'); }
    function openAddSongModal() { 
        document.getElementById('songAlbumSelect').innerHTML = customAlbums.map(a => `<option value="${a}">${a}</option>`).join('');
        document.getElementById('addSongModal').classList.add('active'); 
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function openFullScreen(imgUrl, title) { document.getElementById('fullScreenImg').src = imgUrl; document.getElementById('fullScreenTitle').innerText = title; document.getElementById('fullScreenModal').classList.add('active'); }
    function closeFullScreenModal(e) { if (e.target.classList.contains('fullscreen-modal') || e.target.classList.contains('fullscreen-img-container')) closeFullScreenModalDirect(); }
    function closeFullScreenModalDirect() { document.getElementById('fullScreenModal').classList.remove('active'); }
    function previewFileImage(e) { const r = new FileReader(); r.onload = (ex) => selectedImageBase64 = ex.target.result; r.readAsDataURL(e.target.files[0]); }
    function previewEditFileImage(e) { const r = new FileReader(); r.onload = (ex) => selectedEditImageBase64 = ex.target.result; r.readAsDataURL(e.target.files[0]); }
    
    function renderSidebarMenu() {
        document.getElementById('sidebarMenu').innerHTML = `
            <div class="menu-item ${currentSelectedAlbum === 'ALL' ? 'active' : ''}" onclick="selectAlbum('ALL')">
                <div class="menu-item-left"><div class="menu-icon">📄</div><div>បទទាំងអស់</div></div>
            </div>
            ${customAlbums.map(a => `
                <div class="menu-item ${currentSelectedAlbum === a ? 'active' : ''}" onclick="selectAlbum('${a}')">
                    <div class="menu-item-left"><div class="menu-icon">📖</div><div>${a}</div></div>
                </div>
            `).join('')}`;
    }
    function selectAlbum(name) { currentSelectedAlbum = name; renderSidebarMenu(); renderSongs(); closeMobileSidebar(); }
</script>

</body>
</html>
