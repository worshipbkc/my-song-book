<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងបទចម្រៀងសរសើរតម្កើងព្រះ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --primary-color: #bb86fc;
            --primary-hover: #3700b3;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar Style */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-top: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* Main Content Style */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            max-width: 1100px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dark-mode-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .dark-mode-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-family: 'Kantumruy Pro', sans-serif;
            box-sizing: border-box;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Grid Songs */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .song-img-container {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background: #fff;
        }

        .song-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
            color: var(--text-color);
        }

        .song-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .song-uploader {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .btn-action {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: none;
            color: var(--text-color);
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-save { background-color: rgba(74, 144, 226, 0.1); color: var(--primary-color); border-color: var(--primary-color); }
        .btn-share { background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; border-color: #2ecc71; }
        .btn-edit { background-color: rgba(241, 196, 15, 0.1); color: #f1c40f; border-color: #f1c40f; }
        .btn-delete { background-color: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: #e74c3c; }

        .btn-action:hover {
            opacity: 0.8;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>
<body data-theme="light">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Album ចម្រៀង</h2>
        <div class="user-profile">
            <img src="https://via.placeholder.com/40" alt="User">
            <div>
                <div style="font-weight: bold; font-size: 14px;">Khum phalla</div>
                <div style="font-size: 12px; color: var(--primary-color);">👑 Admin</div>
            </div>
        </div>
        <a href="#" class="nav-item active"><i class="fa-solid fa-music"></i> បទចម្រៀងទាំងអស់</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-folder"></i> ទំនាក់ទំនងពីរុស្ស៊ី</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header-bar">
            <h1><i class="fa-solid fa-music"></i> ចម្រៀងសរសើរតម្កើងព្រះ</h1>
            <!-- Dark Mode នៅចំជ្រុងខាងស្តាំ ស្មើនឹងចំណងជើង -->
            <button class="dark-mode-btn" onclick="toggleDarkMode()"><i class="fa-solid fa-moon" id="theme-icon"></i> ប្តូរពណ៌</button>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ស្វែងរកចំណងជើង ឬ លេខរៀង..." oninput="filterSongs()">
        </div>

        <!-- បញ្ជីបង្ហាញបទចម្រៀងជា Grid -->
        <div class="songs-grid" id="songsGrid"></div>
    </div>

    <!-- Modal សម្រាប់មើលរូបភាពធំ -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImg">
    </div>

    <script>
        // ទិន្នន័យគំរូសាកល្បង (អាចជំនួសដោយ LocalStorage របស់អ្នក)
        let songs = JSON.parse(localStorage.getItem('worship_songs')) || [
            { no: "90", title: "គេឃើញតែមនុស្សម្នាក់គត់", album: "ទំនាក់ទំនងពីរុស្ស៊ី", uploader: "Khum phalla", date: "១២/០៥/២០២៦ ០៨:៣០", image: "" },
            { no: "24", title: "ព្រះនៃខ្ញុំជាបា្រាយយ៉ាងម៉ាំ", album: "ទំនាក់ទំនងពីរុស្ស៊ី", uploader: "Khum phalla", date: "១២/០៥/២០២៦ 09:15", image: "" },
            { no: "55", title: "ខ្ញុំតាំងចិត្តថ្វាយខ្លួនថ្នាក់", album: "ទំនាក់ទំនងពីរុស្ស៊ី", uploader: "Khum phalla", date: "១២/០៥/២០២៦ 10:00", image: "" }
        ];

        // តម្រៀបតាមលេខរៀងស្វ័យប្រវត្តិ (ពីតូចទៅធំ 1, 2, 3...)
        function sortSongs() {
            songs.sort((a, b) => Number(a.no) - Number(b.no));
        }

        function renderSongs(songArray) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = "";

            if (songArray.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-secondary);">រកមិនឃើញបទចម្រៀងទេ</p>`;
                return;
            }

            songArray.forEach((song) => {
                grid.innerHTML = `
                    <div class="song-card">
                        <div class="song-img-container" onclick="openModal('${song.image || 'https://via.placeholder.com/300x400?text=No+Image'}')">
                            <img src="${song.image || 'https://via.placeholder.com/300x400?text=Sheet+Music'}" alt="Sheet">
                        </div>
                        <h3 class="song-title">${song.no}. ${song.title}</h3>
                        <p class="song-meta">📁 ${song.album}</p>
                        <p class="song-uploader">👤 បញ្ចូលដោយ៖ ${song.uploader || 'Admin'} <br>📅 ${song.date || 'ថ្មីៗនេះ'}</p>
                        
                        <div class="card-actions">
                            <button class="btn-action btn-save" onclick="saveSongCard('${song.title}')"><i class="fa-solid fa-bookmark"></i> Save</button>
                            <button class="btn-action btn-share" onclick="shareSong('${song.no}', '${song.title}', '${song.album}')"><i class="fa-solid fa-share-nodes"></i> Share</button>
                            <button class="btn-action btn-edit" onclick="editSong('${song.title}')"><i class="fa-solid fa-pen"></i> កែប្រែ</button>
                            <button class="btn-action btn-delete" onclick="deleteSong('${song.title}')"><i class="fa-solid fa-trash"></i> លុប</button>
                        </div>
                    </div>
                ` + grid.innerHTML; // រក្សាតម្រៀបលំដាប់
            });
        }

        // មុខងារ Share តំណភ្ជាប់ / ព័ត៌មានបទចម្រៀង
        function shareSong(no, title, album) {
            const shareText = `បទចម្រៀងលេខ ${no}: ${title} (Album: ${album})`;
            navigator.clipboard.writeText(shareText).then(() => {
                alert("📋 បានចម្លងព័ត៌មានបទចម្រៀងសម្រាប់ Share រួចរាល់៖\n" + shareText);
            });
        }

        function saveSongCard(title) {
            alert(`💾 បានរក្សាទុកបទ "${title}" រួចរាល់!`);
        }

        function editSong(title) {
            alert(`✏️ កែប្រែបទ៖ ${title}`);
        }

        function deleteSong(title) {
            if(confirm(`តើអ្នកពិតជាចង់លុបបទ "${title}" មែនទេ?`)) {
                songs = songs.filter(s => s.title !== title);
                localStorage.setItem('worship_songs', JSON.stringify(songs));
                sortAndRender();
            }
        }

        function filterSongs() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(keyword) || s.no.includes(keyword));
            renderSongs(filtered);
        }

        function openModal(imgSrc) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                icon.className = "fa-solid fa-sun";
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = "fa-solid fa-moon";
            }
        }

        function sortAndRender() {
            sortSongs();
            renderSongs(songs);
        }

        // រាន់ដំណើរការដំបូង
        sortAndRender();
    </script>
</body>
</html>
